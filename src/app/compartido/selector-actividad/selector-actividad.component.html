<div class="campo">
  <span class="campo-etiqueta">Nivel de actividad</span>
  <button type="button" class="actividad" (click)="abierto.set(true)">
    <span class="actividad-texto">
      <span class="cuerpo-fuerte">{{ actual().nombre }}</span>
      <span class="etiqueta">{{ actual().descripcion }}</span>
    </span>
    <ion-icon name="chevron-down-outline"></ion-icon>
  </button>
</div>

<ion-modal
  class="hoja"
  [isOpen]="abierto()"
  [initialBreakpoint]="0.85"
  [breakpoints]="[0, 0.85]"
  [backdropBreakpoint]="0.85"
  (didDismiss)="abierto.set(false)"
>
  <ng-template>
    <ion-content>
      <div class="hoja-contenido">
        <div>
          <h2 class="titulo-seccion">Nivel de actividad</h2>
          <p class="etiqueta">
            Elige el que más se parezca a tu semana normal, incluido el trabajo.
          </p>
        </div>
        @for (nivel of niveles; track nivel.valor) {
          <button
            type="button"
            class="opcion"
            [class.sel]="nivel.valor === valor()"
            (click)="elegir(nivel.valor)"
          >
            <i class="radio"></i>
            <span class="opcion-texto">
              <span class="cuerpo-fuerte">{{ nivel.nombre }}</span>
              <span class="etiqueta">{{ nivel.descripcion }}</span>
            </span>
          </button>
        }
        <p class="auxiliar">Si dudas entre dos niveles, elige el más bajo.</p>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
