<ion-content>
  <div class="pagina pagina-sin-cabecera">
    <header class="cabecera">
      <h1 class="titulo-pantalla">¿Quién eres?</h1>
      <p class="secundario">Elige tu perfil para continuar.</p>
    </header>

    @for (perfil of perfiles(); track perfil.id) {
      <button
        type="button"
        class="tarjeta tarjeta-perfil"
        [class.ultimo]="perfil.esUltimoUsado"
        (click)="elegir(perfil)"
      >
        <span class="avatar grande" [style.background]="perfil.colorAvatar">
          {{ perfil.nombre.charAt(0).toUpperCase() }}
        </span>
        <span class="datos">
          <span class="cuerpo-fuerte">{{ perfil.nombre }}</span>
          <span class="etiqueta">{{ resumen(perfil) }}</span>
          @if (perfil.esUltimoUsado) {
            <span class="insignia">Último usado</span>
          }
        </span>
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </button>
    }

    <ion-button expand="block" fill="outline" (click)="nuevoPerfil()">
      <ion-icon slot="start" name="add-outline"></ion-icon>
      Crear perfil nuevo
    </ion-button>
  </div>
</ion-content>
